name: tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code@2.1.330
      - run: claude plugin validate .
      - run: claude plugin validate plugins/frie-skills
      - run: claude plugin validate plugins/secret-files-guard
      - run: claude plugin test plugins/frie-skills
      - run: claude plugin test plugins/secret-files-guard
